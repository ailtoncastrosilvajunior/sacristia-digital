# Sacristia Digital - Docker Compose
# PostgreSQL está no servidor na nuvem (Digital Ocean)
# Configure DATABASE_HOST, DATABASE_USERNAME, DATABASE_PASSWORD no .env

services:
  web:
    build: .
    command: bash -c "bundle install && npm install --omit=dev && rm -f tmp/pids/server.pid && bundle exec rails tailwindcss:build && bundle exec rails server -b 0.0.0.0"
    volumes:
      - .:/app
      # Gems persistem entre recriações do container (Gemfile.lock atualizado no host).
      - bundle:/usr/local/bundle
    ports:
      - "3033:3000"
    env_file:
      - .env
    environment:
      RAILS_ENV: development
      BUNDLE_PATH: /usr/local/bundle
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      # URL que o navegador usa (host:porta mapeada). Grover no container acessa web:3000 via liturgia_cartaz_helper.
      APP_HOST: localhost:3033

volumes:
  bundle:

